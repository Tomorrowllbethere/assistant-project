<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MY PERSONNAL ASSISTANT</title>
    {% load static %}
      <!-- нормалізатор -->
	  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize@2.0.0/modern-normalize.min.css">
    <link rel="stylesheet" href="{% static 'custom_auth/css/style.css' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Inspiration&family=Italiana&family=Kodchasan:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
   <header>
      <nav>
          <li>
            <a
              class="nav-button"
              href="{% url 'custom_auth:signup' %}"
              role="button"
              >Sign Up</a
            >
          </li>
          <li>
            <a
              class="nav-button"
              href="{% url 'custom_auth:login' %}"
              role="button"
              >Login</a
            >
          </li>
      </nav>
    </header>
      
    <main>

      {% block content %} {% endblock %} 
      <div class="grid-container">
        <div class="grid-container-1">
            <p>Welcome</p>

              
              <section class="grid-assist">
                <div class="layout-1">
                  <p style="font-family: 'Kodchasan', sans-serif; font-size: 180px; color: #3b5223;" >ASSIST</p>
                </div>
                <div class="layout-2">
                  <p style="font-family: 'Inspiration', sans-serif; font-weight: 400; font-size: 96px; color: #2f302d;">you</p>
                </div>
              </section>
        </div>
        <div class="grid-container-2">
            <li>
              <a
                class="nav-button"
                href="{% url 'custom_auth:signup' %}"
                role="button"
                >Sign Up</a
              >
            </li>
            <li>
              <a
                class="nav-button"
                href="{% url 'custom_auth:login' %}"
                role="button"
                >Login</a
              >
            </li>
        
        </div>
      </div>
 
    </main>
    <footer>
      <p>&copy; 2024 My personnal assistant</p>
    </footer>
  </body>
</html>
